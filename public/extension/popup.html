<!DOCTYPE html>
<html>

<head>
  <title>FeedBite Settings</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" x2="8" y1="13" y2="13"></line>
          <line x1="16" x2="8" y1="17" y2="17"></line>
          <line x1="10" x2="8" y1="9" y2="9"></line>
        </svg>
        <span>FeedBite</span>
      </div>
      <div class="version">v1.0</div>
    </div>

    <div class="form-group">
      <label for="provider">AI Provider</label>
      <div class="select-wrapper">
        <select id="provider">
          <option value="groq">Groq (Fastest)</option>
          <option value="openai">OpenAI (GPT-4o)</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>
    </div>

    <div class="form-group" id="apiKeyGroup">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key" />
      <p class="help-text" id="keyHelp">Get your key from <a href="https://console.groq.com/keys"
          target="_blank">console.groq.com</a></p>
    </div>

    <div class="form-group">
      <label for="model">Model (Optional)</label>
      <input type="text" id="model" placeholder="Default model" />
      <p class="help-text">Leave empty to use default</p>
    </div>

    <button id="saveBtn">
      <span>Save Settings</span>
    </button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
